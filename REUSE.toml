# Who wrote what, and under which licence, by path (REUSE 3.3, https://reuse.software).
# Check with: reuse lint
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ljk5000"
SPDX-License-Identifier = "MIT"

# Bundled fonts: SIL Open Font License 1.1, each with its own authors (see the *-OFL.txt beside them).
[[annotations]]
path = ["KutzUI/Media/Fonts/AnonymousPro-Regular.ttf", "KutzUI/Media/Fonts/AnonymousPro-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2009 Mark Simonson"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["KutzUI/Media/Fonts/Inconsolata-Regular.ttf", "KutzUI/Media/Fonts/Inconsolata-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2006 The Inconsolata Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["KutzUI/Media/Fonts/RobotoMono-Regular.ttf", "KutzUI/Media/Fonts/RobotoMono-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2015 The Roboto Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# The generated atlas combines Lucide and Feather-derived icons; its complete licence ships beside it.
[[annotations]]
path = "KutzUI/Media/Icons/**"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

# Unmodified Lucide sources; the Feather-derived subset below also preserves the MIT notice.
[[annotations]]
path = "tools/lucide/icons/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

[[annotations]]
path = ["tools/lucide/icons/type.svg", "tools/lucide/icons/compass.svg", "tools/lucide/icons/x.svg", "tools/lucide/icons/upload.svg", "tools/lucide/icons/download.svg", "tools/lucide/icons/chevron-left.svg", "tools/lucide/icons/chevron-right.svg", "tools/lucide/icons/minus.svg", "tools/lucide/icons/plus.svg"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"
